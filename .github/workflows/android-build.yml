name: Build Flutter Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Instalar dependências
        run: flutter pub get

      - name: Compilar APK Release
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Renomear APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/seu-app-v1.0.apk

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: seu-app-android
          path: build/app/outputs/flutter-apk/Diario_de_Leituras.apk
